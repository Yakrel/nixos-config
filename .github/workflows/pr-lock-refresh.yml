name: PR Declarative Desktop Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v21

      - name: Verify lock is current
        run: |
          nix flake lock
          git diff --exit-code -- flake.lock

      - name: Check flake
        run: nix flake check --show-trace

      - name: Verify destructive target is stable by-id
        shell: bash
        run: |
          set -euo pipefail
          target="$(nix eval --raw '.#nixosConfigurations.nixos.config.disko.devices.disk.main.device')"
          [[ "$target" == /dev/disk/by-id/* ]]
          echo "Disko target: $target"

      - name: Build Disko installer
        run: nix build --no-link --print-build-logs --show-trace '.#nixosConfigurations.nixos.config.system.build.diskoScript'

      - name: Build complete NixOS system and capture diagnostics
        id: system-build
        shell: bash
        run: |
          set +e
          nix build --no-link --print-build-logs --show-trace '.#nixosConfigurations.nixos.config.system.build.toplevel' >build.log 2>&1
          status=$?
          cat build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload system build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-build-log
          path: build.log

      - name: Fail if system build failed
        if: steps.system-build.outputs.status != '0'
        run: exit 1
