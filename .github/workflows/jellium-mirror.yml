name: Mirror Jellium Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
    paths:
      - .github/workflows/jellium-mirror.yml

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download latest upstream AppImage archive
        shell: bash
        run: |
          set -euo pipefail

          url="https://nightly.link/andrewrabert/jellium-desktop/workflows/build-linux-appimage/main/linux-appimage-x86_64.zip"
          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$url" \
            -o jellium-nightly-x86_64.zip

          count="$(unzip -Z1 jellium-nightly-x86_64.zip | grep -Ec '^JelliumDesktop-.*-x86_64\.AppImage$')"
          test "$count" -eq 1
          sha256sum jellium-nightly-x86_64.zip

      - name: Record upstream revision
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote https://github.com/andrewrabert/jellium-desktop.git refs/heads/main \
            | cut -f1 > jellium-upstream.sha
          test -s jellium-upstream.sha
          cat jellium-upstream.sha

      - name: Publish rolling GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          upstream_sha="$(cat jellium-upstream.sha)"
          cat > release-notes.md <<EOF
          Rolling mirror of the latest successful x86_64 Jellium Desktop AppImage build from upstream main.

          Upstream commit at refresh time: ${upstream_sha}

          This release asset is refreshed weekly and may also be refreshed manually.
          EOF

          if gh release view jellium-nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit jellium-nightly \
              --repo "$GITHUB_REPOSITORY" \
              --title "Jellium Desktop nightly mirror" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create jellium-nightly \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "Jellium Desktop nightly mirror" \
              --notes-file release-notes.md \
              --prerelease
          fi

          gh release upload jellium-nightly \
            jellium-nightly-x86_64.zip \
            jellium-upstream.sha \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
